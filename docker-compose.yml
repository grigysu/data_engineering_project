# Phase 1: MinIO (object store) + Postgres (warehouse backing).
# Phase 2: Spark master + worker for the medallion ETL.
# Hive Metastore and Airflow are added in later phases.

services:
  minio:
    image: minio/minio:latest
    container_name: weather_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job that creates the bucket on first start.
  minio_init:
    image: minio/mc:latest
    container_name: weather_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-weather-lake} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-weather-lake}/bronze &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-weather-lake}/silver &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-weather-lake}/gold &&
        echo 'MinIO bucket layout ready.'
      "

  postgres:
    image: postgres:16
    container_name: weather_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
      POSTGRES_DB: ${POSTGRES_DB:-weather_dw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weather_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: initialize the Hive Metastore schema in metastore_db. Idempotent
  # check via `schematool -info` first — only initializes if the schema is
  # missing. Hive auto-downloads the postgres JDBC driver when DB_DRIVER=postgres.
  hive_init:
    image: apache/hive:4.0.0
    container_name: weather_hive_init
    environment:
      SERVICE_NAME: schematool
      DB_DRIVER: postgres
      SCHEMA_COMMAND: initOrUpgrade
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./docker/hive/jdbc/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      - ./docker/hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    depends_on:
      postgres:
        condition: service_healthy

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: weather_hive_metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Puts /opt/hadoop/share/hadoop/tools/lib/* on the classpath so the
      # metastore can resolve s3a:// LOCATION paths (S3AFileSystem class).
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      # JVM options: JDBC for the metastore backend + S3A config so the
      # metastore can validate/list s3a:// LOCATION URIs against MinIO.
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=minioadmin
        -Dfs.s3a.secret.key=minioadmin
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
    ports:
      - "9083:9083"   # Thrift metastore (for external BI / debug tools)
    volumes:
      - ./docker/hive/jdbc/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      - ./docker/hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    depends_on:
      hive_init:
        condition: service_completed_successfully

  # One-shot: fix ownership on the named volume so the spark user (UID 185)
  # can write Ivy's downloaded JARs. Named volumes default to root:root on
  # first creation; without this, spark-submit --packages fails with
  # FileNotFoundException in /home/spark/.ivy2/cache.
  spark_init:
    image: apache/spark:3.5.6
    container_name: weather_spark_init
    user: root
    command: ["chown", "-R", "spark:spark", "/home/spark/.ivy2"]
    volumes:
      - spark_ivy:/home/spark/.ivy2

  spark-master:
    image: apache/spark:3.5.6
    container_name: weather_spark_master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"   # Master Web UI
      - "7077:7077"   # Master RPC
      - "4040:4040"   # Application UI (when a job is running)
    volumes:
      - ./spark_jobs:/opt/jobs:ro
      - ./docker/spark/conf:/opt/spark/conf:ro
      - spark_ivy:/home/spark/.ivy2   # cache downloaded jars between runs (chowned by spark_init)
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark_init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_started

  spark-worker:
    image: apache/spark:3.5.6
    container_name: weather_spark_worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
    volumes:
      - ./spark_jobs:/opt/jobs:ro
      - ./docker/spark/conf:/opt/spark/conf:ro
      - spark_ivy:/home/spark/.ivy2
    depends_on:
      - spark-master

  # ---------- Airflow (Phase 6) ----------
  # Built from docker/airflow/Dockerfile — extends apache/airflow:2.10 with
  # our runtime deps (ingestion + ML) and the docker CLI so BashOperators
  # can `docker exec` into spark-master for spark-submit tasks.
  airflow_init:
    build: ./docker/airflow
    image: weather_airflow:latest
    container_name: weather_airflow_init
    user: "0:0"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__FERNET_KEY: ""    # auto-generated each run is fine for local dev
      AIRFLOW__WEBSERVER__SECRET_KEY: "weather-dev-secret-not-for-prod"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Phase 2c: enable basic-auth on the REST API so the Streamlit dashboard can
      # trigger DAGs. Order matters — `basic_auth` first so httpx Authorization
      # headers are honored; `session` still works for browser-driven calls.
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW_UID: "0"
    entrypoint: ["/bin/bash", "-c"]
    # Array form so the whole string is a single argv[1] to bash -c, not
    # space-split. The ';' after users-create makes the "user already
    # exists" exit-code non-fatal on reruns.
    command:
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@local ; echo 'airflow init complete.'"
    depends_on:
      postgres:
        condition: service_healthy

  airflow_webserver:
    build: ./docker/airflow
    image: weather_airflow:latest
    container_name: weather_airflow_webserver
    user: "0:0"
    command: webserver
    environment: *airflow-env
    ports:
      - "8081:8080"   # :8080 is taken by Spark master UI
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/weather               # project code, for Python tasks (ingestion + ml.train)
      - /var/run/docker.sock:/var/run/docker.sock   # so BashOperator can `docker exec` spark-master
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  airflow_scheduler:
    build: ./docker/airflow
    image: weather_airflow:latest
    container_name: weather_airflow_scheduler
    user: "0:0"
    command: scheduler
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/weather
      - /var/run/docker.sock:/var/run/docker.sock
    # GPU passthrough so train_model + predict_all_cells use CUDA.
    # Requires NVIDIA Container Toolkit on the host (Docker Desktop with
    # WSL2 + a recent NVIDIA driver covers this on Windows).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      airflow_init:
        condition: service_completed_successfully

  # ---------- Streamlit dashboard (Phase 2c) ----------
  # Single user-facing UI: status, data backfill, training, predict + compare,
  # warehouse browse. Replaces the FastAPI service entirely.
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: weather_dashboard:latest
    container_name: weather_dashboard
    environment:
      # Make the repo root importable as a package root (so `from dashboard.state
      # import …` works — Streamlit only adds the script's own dir to sys.path).
      PYTHONPATH: /app
      # MinIO (predictor + coverage scan)
      MINIO_BUCKET: ${MINIO_BUCKET:-weather-lake}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-weather_dw}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
      # Airflow REST API
      AIRFLOW_BASE_URL: http://airflow_webserver:8080
      AIRFLOW_USER: admin
      AIRFLOW_PASSWORD: admin
      # Predictor defaults
      MODEL_CHECKPOINT: /app/checkpoints/best.pt
      GOLD_PATH: s3://weather-lake/gold/weather_features
      CHECKPOINT_DIR: /app/checkpoints
      # Adminer (Phase 2d)
      ADMINER_URL: http://localhost:8082
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- Adminer (Phase 2d preview, lightweight Postgres UI) ----------
  adminer:
    image: adminer:latest
    container_name: weather_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  spark_ivy:
