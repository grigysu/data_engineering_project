# --- S3A / MinIO ---
# Path-style access is required for MinIO (virtual-host style assumes DNS routing).
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.access.key                 minioadmin
spark.hadoop.fs.s3a.secret.key                 minioadmin
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
# --- JAR packages downloaded on first run, cached in ~/.ivy2 ---
# hadoop-aws version MUST match the Hadoop version bundled in apache/spark:3.5.6
# (Spark 3.5.x ships with Hadoop 3.3.4).
# postgresql driver is for Phase 3 (warehouse loading).
spark.jars.packages                            org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.3

# --packages adds JARs to executor classpath only. Driver-side code that uses
# JDBC directly (e.g. java.sql.DriverManager from py4j) needs the postgres JAR
# on the *driver* classpath too — otherwise ClassNotFoundException.
spark.driver.extraClassPath                    /home/spark/.ivy2/jars/org.postgresql_postgresql-42.7.3.jar

# --- Hive Metastore (Phase 2b) ---
# Spark uses the external metastore at thrift://hive-metastore:9083 (running
# in the hive-metastore container).
#
# warehouse.dir is only for MANAGED tables (we register EXTERNAL tables with
# explicit s3a:// LOCATIONs). Pointing it at /tmp avoids HMS trying to mkdir
# an s3a://.../db path when CREATE DATABASE runs, which would require S3A to
# be wired into the metastore JVM via core-site.xml (more YAML, more JARs).
spark.sql.catalogImplementation                hive
spark.hadoop.hive.metastore.uris               thrift://hive-metastore:9083
spark.sql.warehouse.dir                        file:/tmp/spark-warehouse

# --- Sensible defaults for local dev ---
spark.sql.shuffle.partitions                   8
spark.driver.memory                            1g
spark.executor.memory                          1g
