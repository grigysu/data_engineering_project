# --- S3A / MinIO ---
# Path-style access is required for MinIO (virtual-host style assumes DNS routing).
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.access.key                 minioadmin
spark.hadoop.fs.s3a.secret.key                 minioadmin
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
# --- JAR packages downloaded on first run, cached in ~/.ivy2 ---
# hadoop-aws version MUST match the Hadoop version bundled in apache/spark:3.5.6
# (Spark 3.5.x ships with Hadoop 3.3.4).
# postgresql driver is for Phase 3 (warehouse loading).
spark.jars.packages                            org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.3

# --- Sensible defaults for local dev ---
spark.sql.shuffle.partitions                   8
spark.driver.memory                            1g
spark.executor.memory                          1g
